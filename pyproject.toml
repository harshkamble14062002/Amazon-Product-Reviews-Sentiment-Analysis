[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "amazon-review-sentiment-studio"
version = "0.1.0"
description = "An explainable baseline for classifying Amazon product-review sentiment."
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
