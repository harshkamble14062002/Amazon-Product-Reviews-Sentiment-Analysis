services:
  kafka:
    image: apache/kafka:4.1.2
    hostname: kafka
    container_name: amazon-reviews-kafka

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >
        CONTROLLER:PLAINTEXT,
        PLAINTEXT:PLAINTEXT,
        PLAINTEXT_HOST:PLAINTEXT

      KAFKA_LISTENERS: >
        CONTROLLER://:29093,
        PLAINTEXT://:19092,
        PLAINTEXT_HOST://:9092

      KAFKA_ADVERTISED_LISTENERS: >
        PLAINTEXT://kafka:19092,
        PLAINTEXT_HOST://localhost:9092

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1

      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw

    volumes:
      - kafka_data:/tmp/kraft-combined-logs

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10


  postgres:
    image: postgres:18-alpine
    container_name: amazon-reviews-postgres

    environment:
      POSTGRES_USER: review_app
      POSTGRES_PASSWORD: review_dev_password
      POSTGRES_DB: reviews

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:Z

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U review_app -d reviews"
        ]
      interval: 5s
      timeout: 5s
      retries: 10


  redis:
    image: redis:8-alpine
    container_name: amazon-reviews-redis

    ports:
      - "6379:6379"

    command:
      - redis-server
      - --appendonly
      - "yes"

    volumes:
      - redis_data:/data

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 5s
      timeout: 3s
      retries: 10


  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: amazon-reviews-api

    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      DATABASE_URL: "postgresql://review_app:review_dev_password@postgres:5432/reviews"
      REDIS_HOST: redis
      REDIS_PORT: 6379

    ports:
      - "8000:8000"

    depends_on:
      kafka:
        condition: service_healthy

      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

    restart: unless-stopped


  spark:
    build:
      context: .
      dockerfile: Dockerfile.spark

    container_name: amazon-reviews-spark

    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      DATABASE_URL: "postgresql://review_app:review_dev_password@postgres:5432/reviews"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SPARK_CHECKPOINT_LOCATION: "/opt/app/checkpoints/ml-persistence-v1"

    depends_on:
      kafka:
        condition: service_healthy

      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

    volumes:
      - spark_checkpoints:/opt/app/checkpoints

    command:
      - /opt/spark/bin/spark-submit
      - --master
      - local[*]
      - --conf
      - spark.jars.ivy=/tmp/spark-ivy
      - --packages
      - org.apache.spark:spark-sql-kafka-0-10_2.13:4.2.0
      - --files
      - /opt/app/artifacts/sentiment_pipeline.joblib
      - /opt/app/src/amazon_sentiment/pipeline/spark_inference.py

    restart: unless-stopped


  user-ui:
    build:
      context: .
      dockerfile: Dockerfile.frontend

    container_name: amazon-reviews-user-ui

    environment:
      API_URL: http://api:8000

    ports:
      - "8501:8501"

    depends_on:
      api:
        condition: service_started

    command:
      - streamlit
      - run
      - /app/src/amazon_sentiment/frontend/user_app.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.headless=true

    restart: unless-stopped


  admin-dashboard:
    build:
      context: .
      dockerfile: Dockerfile.frontend

    container_name: amazon-reviews-admin-dashboard

    environment:
      API_URL: http://api:8000

    ports:
      - "8502:8501"

    depends_on:
      api:
        condition: service_started

    command:
      - streamlit
      - run
      - /app/src/amazon_sentiment/frontend/admin_dashboard.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.headless=true

    restart: unless-stopped


volumes:
  kafka_data:
  postgres_data:
  redis_data:
  spark_checkpoints: